<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyAgent · Desktop Control</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111827;--line:#263247;--muted:#9aa8bd;--accent:#67e8f9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#13263a,var(--bg) 48%);color:#eef5ff;font:15px/1.5 Inter,system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:25px;font-weight:750;letter-spacing:-.8px}.muted{color:var(--muted)}.pill{border:1px solid #28515b;color:var(--accent);padding:6px 11px;border-radius:99px;font-size:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:28px}.panel{background:#101827d9;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 60px #0003}h2{font-size:17px;margin:0 0 15px}textarea,button{font:inherit}textarea{width:100%;min-height:110px;background:#080e19;border:1px solid var(--line);border-radius:12px;padding:14px;color:white;resize:vertical}button{background:var(--accent);color:#06202a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.secondary{background:#1c2b40;color:#eaf4ff;border:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.output{white-space:pre-wrap;background:#080e19;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:70px;margin-top:14px;color:#c8d8eb}.tool{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tool:last-child{border:0}.tool small{display:block;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main><div class="top"><div><div class="brand">MYAGENT<span style="color:var(--accent)">.</span></div><div class="muted">Your local PC assistant</div></div><span class="pill" id="status">CONNECTING</span></div>
<div class="grid"><section class="panel"><h2>Talk to your agent</h2><textarea id="message" placeholder="What would you like me to do on your PC?"></textarea><div class="actions"><button id="send">Send message</button><button class="secondary" id="refresh">Refresh tools</button></div><div class="output" id="reply">MyAgent foundation is starting…</div></section><section class="panel"><h2>Available PC tools</h2><div id="tools" class="muted">Loading tools…</div></section></div><p class="muted" style="margin-top:22px;font-size:12px">Local foundation build · Sensitive actions require approval · Do not expose this server to your network yet.</p></main>
<script>const $=id=>document.getElementById(id);async function load(){try{const h=await fetch('/api/health');if(!h.ok)throw Error();$('status').textContent='LOCAL API ONLINE';const r=await fetch('/api/tools');const d=await r.json();$('tools').innerHTML=d.tools.map(t=>'<div class="tool"><div><strong>'+t.name+'</strong><small>'+t.description+'</small></div><span class="pill">'+t.risk+'</span></div>').join('')}catch(e){$('status').textContent='API OFFLINE';$('tools').textContent='Could not reach local API.'}}$('send').onclick=async()=>{const message=$('message').value.trim();if(!message)return;$('reply').textContent='Working…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});$('reply').textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('reply').textContent='Request failed: '+e.message}};$('refresh').onclick=load;load();</script></body></html>
